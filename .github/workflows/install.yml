name: install

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          # 检查标签格式
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if [[ "$is_release" != "true" ]]; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          # 检查是否为预发布版本
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
            echo "This is a pre-release version"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  validation:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  install:
    needs: [meta, validation]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: win
            arch: x86_64
            runner: windows-latest
            rid: win-x64
          - os: win
            arch: aarch64
            runner: windows-11-arm
            rid: win-arm64
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Use .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and build bundled runner
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          ./tools/package.ps1 `
            -Version '${{ needs.meta.outputs.tag }}' `
            -RuntimeIdentifier '${{ matrix.rid }}'

      - name: Archive release
        shell: pwsh
        run: >-
          python tools/archive_release.py
          --source install
          --output "build/release/MaaSVWB-${{ matrix.os }}-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MaaSVWB-${{ matrix.os }}-${{ matrix.arch }}
          path: "build/release/*.zip"
          if-no-files-found: error

      - name: Download final archive for verification
        uses: actions/download-artifact@v4
        with:
          name: MaaSVWB-${{ matrix.os }}-${{ matrix.arch }}
          path: build/downloaded-release

      - name: Smoke-test extracted Runner and Agent without a device
        shell: pwsh
        run: >-
          python tools/smoke_release.py
          --archive "build/downloaded-release/MaaSVWB-${{ matrix.os }}-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}.zip"

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select previous published release
        id: release-base
        run: python tools/release_notes.py --tag "$RELEASE_TAG" --prerelease "$IS_PRERELEASE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          IS_PRERELEASE: ${{ needs.meta.outputs.is_prerelease }}

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          # 从已发布 Release 起算；中间未发布的 tag 不拆分更新说明。
          args: >-
            -vv --strip header
            --tag '${{ needs.meta.outputs.tag }}'
            --tag-pattern '${{ steps.release-base.outputs.tag_pattern }}'
            '${{ steps.release-base.outputs.range }}'
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, install, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: MaaSVWB-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*.zip
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

        # Mirror酱为第三方分发服务，新项目默认关闭
        # 若有需要请联系 Mirror酱 开通，直接自行开启是无法使用的
        # https://mirrorchyan.com/
      - name: Trigger MirrorChyanUploading
        if: false
        # if: ${{ github.repository_owner == 'allenx555' }}
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.meta.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ needs.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
